<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>মুভি ও অ্যাপ হাব প্রো</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-page: #0b0f19;
            --card-bg: #161f30;
            --red-brand: #e50914;
            --blue-brand: #0284c7;
            --green-btn: #10b981;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* হেডার */
        header {
            background: linear-gradient(135deg, #1e1b4b, #0f172a);
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            position: sticky;
            top: 0;
            z-index: 40;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(45deg, var(--red-brand), var(--blue-brand));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .brand-text h1 {
            font-size: 18px;
            font-weight: 700;
        }

        .brand-text p {
            font-size: 11px;
            color: var(--text-sub);
        }

        .btn-add {
            background: var(--green-btn);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 3px 12px rgba(16, 185, 129, 0.4);
        }

        /* সার্চ */
        .search-area {
            padding: 14px 16px 8px 16px;
        }

        .search-box {
            background: #1e293b;
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff !important;
            width: 100%;
            font-size: 14px;
        }

        .search-box input::placeholder {
            color: #64748b;
        }

        /* ফিল্টার বাটন */
        .tabs {
            display: flex;
            gap: 8px;
            padding: 8px 16px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none; }

        .tab-btn {
            background: #1e293b;
            color: var(--text-sub);
            border: 1px solid rgba(255,255,255,0.06);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12.5px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--red-brand);
            color: #ffffff;
            border-color: var(--red-brand);
        }

        /* কার্ড গ্রিড */
        .grid {
            padding: 12px 16px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            flex-grow: 1;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .card-img {
            width: 100%;
            height: 120px;
            position: relative;
            background: #273549;
        }

        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .tag-cat {
            position: absolute;
            top: 6px;
            right: 6px;
            background: var(--blue-brand);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
        }

        .card-details {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .card-title {
            font-size: 13.5px;
            font-weight: 700;
            color: #ffffff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .card-meta {
            font-size: 11px;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .btn-dl {
            background: linear-gradient(135deg, var(--blue-brand), #0369a1);
            color: white;
            border: none;
            padding: 7px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        /* আপলোড ও ডাউনলোড পপআপ */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 16px;
        }

        .modal-box {
            background: #1e293b;
            border-radius: 16px;
            width: 100%;
            max-width: 380px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* পরিষ্কার দেখা যাওয়ার জন্য ইনপুট স্টাইল */
        .input-group {
            text-align: left;
            margin-bottom: 12px;
        }

        .input-group label {
            font-size: 12px;
            color: #cbd5e1;
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .input-group input, .input-group select {
            width: 100%;
            background: #0f172a !important;
            border: 1px solid #475569 !important;
            padding: 10px 12px;
            border-radius: 8px;
            color: #ffffff !important;
            outline: none;
            font-size: 14px;
        }

        .input-group input:focus {
            border-color: var(--blue-brand) !important;
        }

        .btn-submit {
            background: var(--green-btn);
            color: white;
            border: none;
            padding: 11px;
            border-radius: 10px;
            width: 100%;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            margin-top: 6px;
            margin-bottom: 8px;
        }

        .btn-cancel {
            background: transparent;
            color: var(--text-sub);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-direct-link {
            background: var(--red-brand);
            color: white;
            text-decoration: none;
            display: block;
            padding: 11px;
            border-radius: 10px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
        }

        /* ফুটার */
        footer {
            background: #080c14;
            padding: 14px;
            text-align: center;
            font-size: 12px;
            color: var(--text-sub);
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        footer b {
            color: #38bdf8;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- হেডার -->
    <header>
        <div class="brand">
            <div class="brand-icon"><i class="fa-solid fa-play"></i></div>
            <div class="brand-text">
                <h1>মিডিয়া হাব</h1>
                <p>মুভি, নাটক ও প্রিমিয়াম APK</p>
            </div>
        </div>
        <button class="btn-add" onclick="openAddModal()">
            <i class="fa-solid fa-circle-plus"></i> মুভি যোগ করুন
        </button>
    </header>

    <!-- সার্চ বার -->
    <div class="search-area">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass" style="color:var(--text-sub);"></i>
            <input type="text" id="searchInput" placeholder="মুভি বা অ্যাপের নাম লিখুন..." oninput="filterItems()">
        </div>
    </div>

    <!-- ক্যাটাগরি -->
    <div class="tabs">
        <button class="tab-btn active" onclick="setCategory('all', this)">সব কিছু</button>
        <button class="tab-btn" onclick="setCategory('movies', this)">🎬 মুভি</button>
        <button class="tab-btn" onclick="setCategory('natok', this)">🎭 নাটক</button>
        <button class="tab-btn" onclick="setCategory('apps', this)">📱 অ্যাপস</button>
    </div>

    <!-- কার্ড লিস্ট -->
    <div class="grid" id="contentGrid"></div>

    <!-- মুভি/কনটেন্ট আপলোড পপআপ -->
    <div class="modal" id="addModal">
        <div class="modal-box">
            <h3 style="font-size: 17px; margin-bottom: 14px; color: var(--green-btn); text-align: center;">
                <i class="fa-solid fa-cloud-arrow-up"></i> নতুন কনটেন্ট যুক্ত করুন
            </h3>

            <div class="input-group">
                <label>ক্যাটাগরি:</label>
                <select id="inCat">
                    <option value="movies">মুভি (Movie)</option>
                    <option value="natok">নাটক (Natok)</option>
                    <option value="apps">অ্যাপস (Apps)</option>
                </select>
            </div>

            <div class="input-group">
                <label>নাম / টাইটেল:</label>
                <input type="text" id="inTitle" placeholder="যেমন: Pushpa 2 / তুফান">
            </div>

            <div class="input-group">
                <label>সাইজ ও কোয়ালিটি:</label>
                <input type="text" id="inSize" placeholder="যেমন: 1.5 GB • 1080p Web-DL">
            </div>

            <div class="input-group">
                <label>পোস্টার / ছবির লিংক:</label>
                <input type="text" id="inImg" placeholder="ছবির ডিরেক্ট URL দিন (না দিলে ডিফল্ট বসবে)">
            </div>

            <div class="input-group">
                <label>ডাউনলোড লিংক (Drive / Telegram):</label>
                <input type="text" id="inLink" placeholder="https://t.me/...">
            </div>

            <button class="btn-submit" onclick="saveContent()">
                <i class="fa-solid fa-check"></i> ওয়েবসাইটে পোস্ট করুন
            </button>
            <button class="btn-cancel" onclick="closeAddModal()">বাতিল করুন</button>
        </div>
    </div>

    <!-- ডাউনলোড লিংক পপআপ -->
    <div class="modal" id="dlModal">
        <div class="modal-box" style="text-align: center;">
            <img id="dlImg" src="" style="width: 80px; height: 80px; border-radius: 12px; object-fit: cover; margin-bottom: 10px;">
            <h3 id="dlTitle" style="font-size: 16px; margin-bottom: 4px;"></h3>
            <p id="dlDetails" style="font-size: 12px; color: var(--text-sub); margin-bottom: 14px;"></p>
            <a id="dlAction" href="#" target="_blank" class="btn-direct-link">
                <i class="fa-solid fa-download"></i> সরাসরি ডাউনলোড করুন
            </a>
            <button class="btn-cancel" onclick="closeDlModal()">বন্ধ করুন</button>
        </div>
    </div>

    <!-- ফুটার -->
    <footer>
        <div>ডিজাইন ও নির্মাণে: <b>এমডি রাফিম হোসেন</b></div>
        <div style="font-size: 11px; margin-top: 3px;">© 2026 প্রিমিয়াম মিডিয়া হাব</div>
    </footer>
</div>

<script>
    const INITIAL_DATA = [
        {
            id: 1,
            title: "Tufan (তুফান) Full Movie",
            category: "movies",
            catLabel: "মুভি",
            size: "2.1 GB • 1080p",
            img: "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=500&q=80",
            downloadUrl: "https://t.me/"
        },
        {
            id: 2,
            title: "Pushpa 2: The Rule",
            category: "movies",
            catLabel: "মুভি",
            size: "2.4 GB • 1080p",
            img: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=500&q=80",
            downloadUrl: "https://t.me/"
        },
        {
            id: 3,
            title: "ব্যাচেলর পয়েন্ট সিজন ৫",
            category: "natok",
            catLabel: "নাটক",
            size: "450 MB • HD",
            img: "https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=500&q=80",
            downloadUrl: "https://t.me/"
        },
        {
            id: 4,
            title: "CapCut Pro Mod APK",
            category: "apps",
            catLabel: "অ্যাপ",
            size: "135 MB • No Watermark",
            img: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500&q=80",
            downloadUrl: "https://t.me/"
        }
    ];

    let contentList = JSON.parse(localStorage.getItem('media_hub_items')) || INITIAL_DATA;
    let currentCategory = 'all';

    function renderCards(data) {
        const grid = document.getElementById('contentGrid');
        grid.innerHTML = '';

        if(data.length === 0) {
            grid.innerHTML = `<div style="grid-column: span 2; text-align: center; color: var(--text-sub); padding: 40px 0;">কোনো কনটেন্ট পাওয়া যায়নি!</div>`;
            return;
        }

        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-img">
                    <img src="${item.img}" alt="${item.title}" onerror="this.src='https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=500&q=80'">
                    <span class="tag-cat">${item.catLabel}</span>
                </div>
                <div class="card-details">
                    <div>
                        <div class="card-title">${item.title}</div>
                        <div class="card-meta"><i class="fa-solid fa-file"></i> ${item.size}</div>
                    </div>
                    <button class="btn-dl" onclick="openDlModal(${item.id})">
                        <i class="fa-solid fa-download"></i> ডাউনলোড
                    </button>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function setCategory(cat, elem) {
        currentCategory = cat;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        elem.classList.add('active');
        filterItems();
    }

    function filterItems() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const filtered = contentList.filter(item => {
            const matchCat = (currentCategory === 'all') || (item.category === currentCategory);
            const matchSearch = item.title.toLowerCase().includes(query);
            return matchCat && matchSearch;
        });
        renderCards(filtered);
    }

    function openAddModal() {
        document.getElementById('addModal').style.display = 'flex';
    }

    function closeAddModal() {
        document.getElementById('addModal').style.display = 'none';
    }

    function saveContent() {
        const cat = document.getElementById('inCat').value;
        const title = document.getElementById('inTitle').value.trim();
        const size = document.getElementById('inSize').value.trim();
        const img = document.getElementById('inImg').value.trim();
        const link = document.getElementById('inLink').value.trim();

        if(!title || !size || !link) {
            alert('দয়া করে নাম, সাইজ এবং ডাউনলোড লিংক পূরণ করুন!');
            return;
        }

        let catText = "মুভি";
        if(cat === "natok") catText = "নাটক";
        if(cat === "apps") catText = "অ্যাপ";

        const newItem = {
            id: Date.now(),
            title: title,
            category: cat,
            catLabel: catText,
            size: size,
            img: img || "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=500&q=80",
            downloadUrl: link
        };

        contentList.unshift(newItem);
        localStorage.setItem('media_hub_items', JSON.stringify(contentList));

        // ফর্ম ক্লিয়ার
        document.getElementById('inTitle').value = '';
        document.getElementById('inSize').value = '';
        document.getElementById('inImg').value = '';
        document.getElementById('inLink').value = '';

        closeAddModal();
        filterItems();
        alert('আপনার কনটেন্টটি সফলভাবে যোগ করা হয়েছে!');
    }

    function openDlModal(id) {
        const item = contentList.find(i => i.id === id);
        if(!item) return;

        document.getElementById('dlImg').src = item.img;
        document.getElementById('dlTitle').innerText = item.title;
        document.getElementById('dlDetails').innerText = item.size;
        document.getElementById('dlAction').href = item.downloadUrl;
        document.getElementById('dlModal').style.display = 'flex';
    }

    function closeDlModal() {
        document.getElementById('dlModal').style.display = 'none';
    }

    // ইনিশিয়াল লোড
    renderCards(contentList);
</script>

</body>
</html>
